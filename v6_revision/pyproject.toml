[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "materials-transportability-v6"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "joblib==1.5.3",
  "numpy==2.1.3",
  "pandas==2.2.3",
  "pyarrow==17.0.0",
  "scikit-learn==1.5.2",
  "scipy==1.14.1",
]

[project.optional-dependencies]
test = ["pytest==8.3.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
