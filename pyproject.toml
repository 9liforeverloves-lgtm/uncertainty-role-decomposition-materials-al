[build-system]
requires = ["setuptools==75.8.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "materials-transportability-v6"
version = "0.2.0"
description = "Calibration/acquisition decoupling for offline materials screening"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "joblib==1.5.3",
  "numpy==2.1.3",
  "pandas==2.2.3",
  "pyarrow==17.0.0",
  "scikit-learn==1.5.2",
  "scipy==1.14.1",
]

[project.optional-dependencies]
test = [
  "pytest==8.3.3",
]
plotting = [
  "matplotlib==3.11.0",
  "pillow==12.3.0",
]
materials = [
  "pymatgen==2024.10.29",
]
deep-learning = [
  "torch>=2.4,<3",
]
development = [
  "build==1.2.2.post1",
  "pytest==8.3.3",
  "ruff==0.12.5",
]

[project.scripts]
transportability-v6 = "transportability_v6.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["transportability_v6*"]

[tool.pytest.ini_options]
testpaths = ["tests", "v6_revision/tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
