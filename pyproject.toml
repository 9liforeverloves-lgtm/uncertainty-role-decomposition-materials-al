[build-system]
requires = ["setuptools==75.8.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "materials-transportability-v6"
version = "1.0.0"
description = "Calibration/acquisition decoupling for offline materials screening"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "BSD-3-Clause"}
authors = [
  {name = "Renjie Li"},
]
classifiers = [
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "joblib==1.5.3",
  "numpy==2.1.3",
  "pandas==2.2.3",
  "pyarrow==17.0.0",
  "PyYAML==6.0.2",
  "scikit-learn==1.5.2",
  "scipy==1.14.1",
]

[project.optional-dependencies]
test = [
  "pytest==8.3.3",
  "pypdf==6.1.1",
]
plotting = [
  "matplotlib==3.11.1",
  "pillow==12.3.0",
]
materials = [
  "pymatgen==2024.10.29",
]
deep-learning = [
  "torch>=2.4,<3",
]
development = [
  "build==1.2.2.post1",
  "pytest==8.3.3",
  "ruff==0.12.5",
]
release = [
  "matplotlib==3.11.1",
  "pillow==12.3.0",
  "pypdf==6.1.1",
  "requests==2.34.2",
]

[project.scripts]
transportability-v6 = "transportability_v6.cli:main"

[tool.setuptools]
package-dir = {"" = "src", "p1_extension" = "p1_extension"}
packages = ["transportability_v6", "transportability_v6.smoke_only", "p1_extension"]
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES"]

[tool.pytest.ini_options]
testpaths = ["tests", "v6_revision/tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
