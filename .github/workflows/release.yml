name: release-candidate
on:
  push:
    tags: ["v*"]
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-lock.txt && python -m pip install . build==1.3.0
      - run: python -m pip check
      - run: python scripts/verify_release.py
      - run: python scripts/build_release_candidate.py
      - run: python scripts/verify_release.py --root dist/release_candidate
      - run: python scripts/verify_archive_checksums.py --root dist/release_candidate
      - run: python scripts/build_archive_upload_candidate.py
      - run: python -m build --sdist --outdir dist/source_distribution
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.ref_name }}
          path: dist/release_candidate
      - uses: actions/upload-artifact@v4
        with:
          name: source-distribution-${{ github.ref_name }}
          path: dist/source_distribution/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: archive-upload-candidate-${{ github.ref_name }}
          path: |
            dist/archive_upload_candidate/*.zip
            dist/archive_upload_candidate/SHA256SUMS
      # No publication or archive upload occurs here. Author approval and
      # hosting-platform configuration are separate gates.
