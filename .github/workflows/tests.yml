name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install .
      - run: python -m pip check
      - run: python scripts/verify_release.py
      - run: python -m pytest tests v6_revision/tests -q
      - run: python scripts/reproduce_smoke.py --output-dir "${{ runner.temp }}/path with spaces/复现"
